<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Облік особового складу" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset=".5" stop-color="#f5b82e"/>
      <stop offset="1" stop-color="#b7791f"/>
    </linearGradient>
    <linearGradient id="gold-v" gradientUnits="userSpaceOnUse" x1="0" y1="14" x2="0" y2="48">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#e0a52a"/>
    </linearGradient>
    <linearGradient id="field" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f5a3a"/>
      <stop offset="1" stop-color="#123524"/>
    </linearGradient>
  </defs>
  <!-- щит із золотою облямівкою -->
  <path d="M32 3 L57 11.5 V30 C57 45.5 46.5 55.5 32 61.5 C17.5 55.5 7 45.5 7 30 V11.5 Z" fill="url(#gold)"/>
  <!-- зелене поле всередині -->
  <path d="M32 7.5 L52.5 14.4 V30 C52.5 43 44 51.5 32 56.8 C20 51.5 11.5 43 11.5 30 V14.4 Z" fill="url(#field)"/>
  <!-- три шеврони -->
  <g fill="none" stroke="url(#gold-v)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="20,18 32,26 44,18"/>
    <polyline points="20,27 32,35 44,27"/>
    <polyline points="20,36 32,44 44,36"/>
  </g>
</svg>
