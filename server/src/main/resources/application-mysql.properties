# Цей файл підключається ТІЛЬКИ коли запущено з профілем "mysql"
# (змінна середовища SPRING_PROFILES_ACTIVE=mysql). У Docker ми її виставимо в compose.
# Усе, чого тут немає, береться з application.properties.

# Адреса MySQL збирається зі змінних із .env: DB_HOST, DB_PORT, DB_NAME
# useSSL=false та allowPublicKeyRetrieval=true потрібні для MySQL 8 без сертифікатів
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# База стартує довше за застосунок: чекаємо її до 60 секунд замість миттєвого падіння
spring.datasource.hikari.initialization-fail-timeout=60000
spring.datasource.hikari.connection-timeout=5000