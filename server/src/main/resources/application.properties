spring.application.name=Start_Project

# Порт усередині застосунку. Ззовні його змінює .env (API_PORT), тут лише значення за замовчуванням
server.port=${APP_PORT:8000}

# JSON з нижнім підкресленням: fullName у коді -> full_name у відповіді
spring.jackson.property-naming-strategy=SNAKE_CASE

# Hibernate сам створює і оновлює таблиці.
spring.jpa.hibernate.ddl-auto=update
# Не тримати відкритим з'єднання з БД після відповіді контролера (зайве для REST)
spring.jpa.open-in-view=false

# ЛОКАЛЬНИЙ РЕЖИМ без Docker і без MySQL: база живе в пам'яті і зникає при зупинці.
# MODE=MySQL: H2 поводиться як MySQL
spring.datasource.url=jdbc:h2:mem:personnel;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# Версія та середовище; у Docker їх задає .env
app.version=${APP_VERSION:dev}
app.env=${APP_ENV:development}

# Показувати в JSON-помилках текст причини і які саме поля не пройшли перевірку
server.error.include-message=always
server.error.include-binding-errors=always

# Де лежить веб-сторінка. Відносно папки, з якої запущено застосунок (у IDE це корінь проєкту)
app.client-dir=${CLIENT_DIR:../client}

# Єдиний користувач. УВАГА: значення за замовчуванням лише для локальної розробки
app.auth.username=${ADMIN_USERNAME:admin}
app.auth.password=${ADMIN_PASSWORD:admin}

# Секрет для підпису токенів, не менше 32 символів. У production його задає .env
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-0123456789}
# Скільки хвилин дійсний токен (480 = 8 годин)
app.jwt.expire-minutes=${JWT_EXPIRE_MINUTES:480}
